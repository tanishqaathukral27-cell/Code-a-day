<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Web Page</title>
    <link rel="stylesheet" href="code.css">
</head>
<body>
    <section class="welcome" id="welcome">
        <div class="welcome-content">
            <h1>Code-a-day</h1>
            <p> Let's get started with coding</p>
            <button class="welcome-button" id="welcome-btn">
                Let's begin
            </button>
            </div>
    <section class="loading" id="loading">
        <div class="loading-content">
            <h2>Loading...</h2>
            <p>Please wait while we prepare to code your day.</p>
        </div>
    </section>
    <section class="category" id="category">
        <div class="category-content">
            <h2>Choose a category</h2>
            <p>Select a category to start coding.</p>
            <button class="category-button" id="category-btn">
                Choose Category
            </button>
        </div>
    </section>
    <section class="question-choice" id="question-choice">
        <div class="choice" id="choice">
            <button class="pyschology" id="psychology-btn">Psychology</button>
            <button class="pop" id="pop-btn">Pop Culture</button>
            <button
        </div>
    <section class="morning-page" id="morning">
        <div class="morning-content">
            <h2>Let's start your morning.</h2>
            <p>Start your day with a refreshing morning routine.</p>
            <button class="morning-button" id="morning-btn">
                Plan Morning
            </button>
        </div>

</body>
<script src="script.js"></script>
</html>
