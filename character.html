<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Web Page</title>
    <link rel="stylesheet" href="code.css">
</head>

<body>

<section class="characters" id="characters">

    <div class="characters-content">
        <h2>Choose a character</h2>
        <p>Select a character to start coding.</p>
    </div>

    <div class="character" id="character">

        <div id="dawn" class="dawn">
            <img src="assets/dawn.png" alt="Character 1" class="character1" id="character1">
            <button class="character1-btn" id="character1-btn">Dawn</button>
        </div>

        <div id="serena" class="serena">
            <img src="assets/serena.png" alt="Character 2" class="character2" id="character2">
            <button class="character2-btn" id="character2-btn">Serena</button>
        </div>

        <div id="misty" class="misty">
            <img src="assets/misty.png" alt="Character 3" class="character3" id="character3">
            <button class="character3-btn" id="character3-btn">Misty</button>
        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
