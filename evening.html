<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Code-a-Day | Morning</title>

    <link rel="stylesheet" href="code.css">
</head>

<body data-page="evening">

    <section class="evening" id="evening">

        <!-- MORNING HEADING -->

        <div class="morning-header">
            <h1>Good Evening!</h1>
            <p>Choose a card to begin your day.</p>
        </div>
 <div class="character-container">
    <img id="character-image" src="" alt="Your character">
</div>

        <!-- QUESTION CARDS -->

        <div class="question-cards" id="question-cards">

            <div class="question-card" id="question-card-1">
                <span>1</span>
            </div>

            <div class="question-card" id="question-card-2">
                <span>2</span>
            </div>

            <div class="question-card" id="question-card-3">
                <span>3</span>
            </div>

        </div>


        <!-- QUESTION AREA -->

        <div class="question-area" id="question-area">

            <h2 id="question-text"></h2>

            <div class="answer-buttons" id="answer-buttons">
            </div>

        </div>

<div class="question-area" id="question-area">

    <h2 id="question-text"></h2>

    <div class="answer-buttons" id="answer-buttons">
    </div>

    <div class="answer-result" id="answer-result"></div>

</div>
        <!-- GOOD / BAD CHOICES -->

        <div class="choices-area" id="choices-area">

            <h2 id="choices-title"></h2>

            <div class="choice-buttons" id="choice-buttons">
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
